name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flyology-postgres-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out sources
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Install Alire
        uses: alire-project/setup-alire@fc4c8ce471aa30b3af0d39ce15add1ee9eaf28f2 # v6.0.0
        with:
          version: 2.1.1
          toolchain: >-
            gnat_native=16.1.0
            gprbuild=26.0.1
          cache: true
      - name: Select toolchain
        run: |
          alr --non-interactive toolchain --select \
            gnat_native=16.1.0 \
            gprbuild=26.0.1
      - name: Configure Flyology index
        run: |
          alr index --reset-community
          alr index \
            --add=git+https://github.com/flyology-ada/alire-index.git \
            --name=flyology \
            --before=community
      - name: Cache PostgreSQL test installation
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: tests/.cache/postgres
          key: postgresql-18.4-openssl-${{ runner.os }}-${{ runner.arch }}
      - name: Run protocol and integration tests
        working-directory: tests
        run: |
          alr -n build
          ./scripts/test.sh
      - name: Run psqlish tests
        working-directory: examples/psqlish
        env:
          POSTGRES_INTEGRATION: 1
        run: |
          alr -n build
          ./scripts/test.sh
      - name: Run SQL parser tests
        working-directory: sql/tests
        run: ./scripts/test.sh
      - name: Run pgish tests
        working-directory: examples/pgish
        run: |
          alr -n build
          ./scripts/test.sh
