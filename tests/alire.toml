name = "tests"
description = "Tests for Flyology Postgres"
version = "0.1.0-dev"

authors = ["Yurii Rashkovskii"]
maintainers = ["Yurii Rashkovskii <yrashk@gmail.com>"]
maintainers-logins = ["yrashk"]
licenses = "MIT OR Apache-2.0"
website = "https://github.com/flyology-ada/flyology-postgres"
tags = ["testing", "postgres", "protocol"]

executables = ["tests", "postgres_test_server", "postgres_test_client", "postgres_test_cancellation", "postgres_test_replication", "postgres_test_replication_server", "postgres_test_logical_primary", "postgres_test_durable_store"]

[[depends-on]]
flyology_postgres = "*"

[[pins]]
flyology_postgres = { path = ".." }

[[depends-on]]
aunit = "^26.0.0"

[[actions]]
type = "test"
command = ["./scripts/test.sh"]
